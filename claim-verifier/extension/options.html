<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      padding: 16px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      max-width: 400px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #5f6368;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .save-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .save-btn:hover {
      background: #1557b0;
    }
    .message {
      margin-top: 10px;
      font-size: 12px;
      color: #137333;
    }
  </style>
</head>
<body>
  <h1>Claim Verifier URL</h1>
  <label for="baseUrl">App URL (e.g. http://localhost:8501 or your deployed app)</label>
  <input type="url" id="baseUrl" placeholder="http://localhost:8501">
  <button id="saveBtn" class="save-btn">Save</button>
  <div id="message" class="message" style="display: none;"></div>
  <script src="options.js"></script>
</body>
</html>
