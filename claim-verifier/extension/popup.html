<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 12px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      min-height: 72px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      font: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #1a73e8;
    }
    .verify-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .verify-btn:hover {
      background: #1557b0;
    }
    .verify-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .options-link {
      display: block;
      margin-top: 10px;
      font-size: 11px;
      color: #5f6368;
      text-decoration: none;
    }
    .options-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Verify claim</h2>
  <textarea id="claimInput" placeholder="Paste or type a claim to verify..."></textarea>
  <button id="verifyBtn" class="verify-btn">Open in Claim Verifier</button>
  <a href="#" id="optionsLink" class="options-link">Set Claim Verifier URL</a>
  <script src="popup.js"></script>
</body>
</html>
