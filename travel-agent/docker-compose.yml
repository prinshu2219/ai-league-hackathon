services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_agent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-travel_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_agent} -d ${POSTGRES_DB:-travel_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  travel-agent:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-travel_agent}:${POSTGRES_PASSWORD:-travel_agent_secret}@postgres:5432/${POSTGRES_DB:-travel_agent}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
