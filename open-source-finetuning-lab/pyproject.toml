[project]
name = "open-source-finetuning-lab"
version = "0.1.0"
description = "L1 interview project for Hugging Face, PyTorch, and basic LoRA fine-tuning."
requires-python = ">=3.9"
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.42.0",
  "datasets>=2.19.0",
  "peft>=0.11.0",
  "accelerate>=0.31.0",
  "huggingface-hub>=0.23.0",
  "safetensors>=0.4.3",
  "scikit-learn>=1.4.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "streamlit>=1.35.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
